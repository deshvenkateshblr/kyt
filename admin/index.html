<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYT Admin - Curated trips</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>KYT Admin</strong><span class="muted"> Curated trips</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="./places.html" class="muted" style="text-decoration:none; font-size:13px; font-weight:500;">📍 Place ID Manager ↗</a>
      <div id="status" class="muted" aria-live="polite"></div>
    </div>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Steps"></nav>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- The city catalog is optional: without it the tool still works but cannot check city ids. -->
  <script src="../data/cities.js" onerror="window.__noCatalog = true"></script>
  <script src="./core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
